<div class="centered splash">
	<svg class="optimaerp-loader" width="56" height="56" viewBox="34 34 100 100" role="img" aria-label="Loading">
		<style>
			/* Overrides Frappe's splash: the OptimaERP ring spins on the page background, no tile.
			   Inline so it follows the desk theme; this is also pasted into a JS template literal
			   by login.js, so keep it free of backticks. */
			.optimaerp-loader { --loader-ink: #0e1116; display: block; }
			[data-theme="dark"] .optimaerp-loader { --loader-ink: #ffffff; }
			@media (prefers-color-scheme: dark) {
				[data-theme="automatic"] .optimaerp-loader { --loader-ink: #ffffff; }
			}
			.optimaerp-loader .ink { fill: var(--loader-ink); }
			.optimaerp-loader .blue { fill: #2747f5; }
			.optimaerp-loader .ring {
				transform-box: fill-box;
				transform-origin: center;
				animation: optimaerp-loader-spin 1.1s linear infinite;
			}
			@keyframes optimaerp-loader-spin { to { transform: rotate(360deg); } }
			@keyframes optimaerp-loader-pulse { to { opacity: 0.35; } }
			@media (prefers-reduced-motion: reduce) {
				.optimaerp-loader .ring { animation: optimaerp-loader-pulse 0.9s ease-in-out infinite alternate; }
			}
		</style>
		<g class="ring">
			<path class="blue" d="M86.99 37.9A46.2 46.2 0 0 1 130.1 81.01L112.72 81.01A28.88 28.88 0 0 0 86.99 55.28Z"/>
			<path class="ink" d="M81.01 37.9A46.2 46.2 0 0 0 37.9 81.01L55.28 81.01A28.88 28.88 0 0 1 81.01 55.28ZM86.99 130.1A46.2 46.2 0 0 0 130.1 86.99L112.72 86.99A28.88 28.88 0 0 1 86.99 112.72ZM81.01 130.1A46.2 46.2 0 0 1 37.9 86.99L55.28 86.99A28.88 28.88 0 0 0 81.01 112.72Z"/>
		</g>
		<path class="ink" d="M76.3 76.3h15.4v15.4h-15.4Z"/>
	</svg>
</div>
