			<rect x="399" y="106" width="10" height="16" rx="2" transform="rotate(210 404 160)"/>
			<rect x="399" y="106" width="10" height="16" rx="2" transform="rotate(240 404 160)"/>
			<rect x="399" y="106" width="10" height="16" rx="2" transform="rotate(270 404 160)"/>
			<rect x="399" y="106" width="10" height="16" rx="2" transform="rotate(300 404 160)"/>
			<rect x="399" y="106" width="10" height="16" rx="2" transform="rotate(330 404 160)"/>
		</g>
		<circle cx="404" cy="160" r="16" stroke="#2747F5" stroke-width="7"/>
