<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" fill="none" aria-hidden="true">
	<style>
		.ring { transform-origin: 290px 300px; animation: cw 22s linear infinite; }
		.gear-a { transform-origin: 404px 160px; animation: ccw 10s linear infinite; }
		.gear-b { transform-origin: 148px 384px; animation: ccw 7s linear infinite; }
		@keyframes cw { to { transform: rotate(360deg); } }
		@keyframes ccw { to { transform: rotate(-360deg); } }
		@media (prefers-reduced-motion: reduce) { .ring, .gear-a, .gear-b { animation: none; } }
	</style>
	<defs>
		<radialGradient id="glow" cx="290" cy="300" r="230" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#2747F5" stop-opacity=".38"/>
			<stop offset="1" stop-color="#2747F5" stop-opacity="0"/>
		</radialGradient>
		<filter id="lift" x="-20%" y="-30%" width="140%" height="190%">
			<feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".35"/>
		</filter>
	</defs>

	<circle cx="290" cy="300" r="230" fill="url(#glow)"/>

	<g class="gear-a">
